services:
  - type: web
    name: llm-cost-autopilot
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: OPTIMIZATION_STRATEGY
        value: balanced
      - key: EASY_MODEL
        value: gemini-3.5-flash-lite
      - key: MEDIUM_MODEL
        value: claude-sonnet-5
      - key: HARD_MODEL
        value: gpt-5.6-sol
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
